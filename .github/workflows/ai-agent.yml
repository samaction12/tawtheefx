name: AI Multi-Agent System
on:
  issue_comment:
    types: [created]

jobs:
  developer:
    if: contains(github.event.comment.body, '/fix') && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: pip install aider-chat

      - name: Run Developer Agent (Groq)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          git config --global user.name "Developer AI"
          git config --global user.email "dev@tawtheefx.com"
          
          BRANCH_NAME="ai-fix-issue-${{ github.event.issue.number }}"
          git checkout -b $BRANCH_NAME
          
          # الوكيل بيقرا الدستور الأول
          cat AGENTS.md
          
          # الوكيل بينفذ المهمة
          aider --model groq/llama-3.3-70b-versatile --yes --no-gitignore --message "You are the Developer Agent. Follow AGENTS.md rules strictly. Fix this issue: $ISSUE_TITLE. Details: $ISSUE_BODY. Do not create new files unless necessary."
          
          git add .
          git commit -m "AI Fix for issue #${{ github.event.issue.number }}" || echo "No changes made"
          git push origin $BRANCH_NAME
          
          # الوكيل بيعمل Pull Request
          gh pr create --title "AI Fix: ${{ github.event.issue.title }}" --body "Automated fix generated by Developer Agent. Resolves #${{ github.event.issue.number }}" --base main || echo "PR already exists"
