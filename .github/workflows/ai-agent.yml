name: AI Coding Agent
on:
  issue_comment:
    types: [created]

jobs:
  aider-fix:
    if: contains(github.event.comment.body, '/fix') && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: pip install aider-chat

      - name: Run Aider (Fix Issue)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          git config --global user.name "AI Agent"
          git config --global user.email "ai@tawtheefx.com"
          
          BRANCH_NAME="ai-fix-issue-${{ github.event.issue.number }}"
          git checkout -b $BRANCH_NAME
          
          # الموديل الجديد: llama-3.3-70b-versatile
          aider src/components/Footer.tsx --model groq/llama-3.3-70b-versatile --yes --no-gitignore --message "You must modify the file src/components/Footer.tsx. Change the text 'ThakiHire' to 'ThakiHire AI'. Do not create new files, only edit this file. Issue details: $ISSUE_BODY"
          
          git add .
          git commit -m "AI Fix for issue #${{ github.event.issue.number }}" || echo "No changes made"
          git push origin $BRANCH_NAME
          
          gh pr create --title "AI Fix: Update Footer" --body "Automated fix generated by AI Agent. Resolves #${{ github.event.issue.number }}" --base main || echo "PR already exists"
