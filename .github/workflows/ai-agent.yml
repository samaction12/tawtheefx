name: AI Agent (Aider + Gemini)
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  aider:
    if: contains(github.event.comment.body, '/aider')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: pip install aider-chat

      - name: Run Aider with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config --global user.name "Aider Agent"
          git config --global user.email "aider-agent@bot.com"
          
          # 1. مسح الفرع القديم من GitHub لو موجود (عشان نتجنب مشكلة الرفض)
          git push origin --delete ai-fix-$ISSUE_NUMBER || true
          
          # 2. تشغيل Aider
          aider --model gemini/gemini-3.8-flash --yes --no-gitignore --message "Fix this code issue. Title: $ISSUE_TITLE. Details: $ISSUE_BODY. Please modify the relevant files to fix this." || true
          
          # 3. مسح الملفات المؤقتة الخاصة بـ Aider عشان ما تترفعش
          rm -rf .aider* || true
          
          # 4. إنشاء فرع جديد ورفع التعديلات
          git checkout -b ai-fix-$ISSUE_NUMBER
          git add .
          git commit -m "AI Fix for issue #$ISSUE_NUMBER" || echo "No changes to commit"
          git push origin ai-fix-$ISSUE_NUMBER --force
          
          # 5. إنشاء Pull Request
          gh pr create --title "AI Fix: $ISSUE_TITLE" --body "Automated fix generated by Aider (Gemini). Resolves #$ISSUE_NUMBER" --base main || echo "PR already exists or no changes"
