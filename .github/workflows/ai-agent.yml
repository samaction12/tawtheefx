name: AI Agent (Aider + Gemini)
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  aider:
    if: github.event.comment.body == '/aider' && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: pip install aider-chat

      - name: Run Aider with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config --global user.name "Aider Agent"
          git config --global user.email "aider-agent@bot.com"
          
          # تشغيل Aider
          aider --model gemini/gemini-1.5-pro --yes --message "Fix this issue: $ISSUE_TITLE. Details: $ISSUE_BODY" || true
          
          # إنشاء فرع ورفع التعديلات
          git checkout -b ai-fix-$ISSUE_NUMBER
          git commit -am "AI Fix for issue #$ISSUE_NUMBER" || echo "No changes made"
          git push origin ai-fix-$ISSUE_NUMBER
          
          # إنشاء Pull Request
          gh pr create --title "AI Fix: $ISSUE_TITLE" --body "Automated fix generated by Aider (Gemini). Resolves #$ISSUE_NUMBER" --base main || echo "PR might already exist or no changes"
